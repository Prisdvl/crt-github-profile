name: Refresh profile assets

on:
  workflow_dispatch:
  schedule:
    # Weekly Monday 03:17 UTC
    - cron: "17 3 * * 1"

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate profile configuration
        run: npm run validate:config

      - name: Generate profile assets
        env:
          # Public contribution HTML works without auth; the token improves
          # rate limits for activity requests. Never echo the token.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run generate

      - name: Validate generated SVG assets
        run: |
          node --input-type=module -e "
          import fs from 'fs';
          import { DOMParser } from '@xmldom/xmldom';
          const config = JSON.parse(fs.readFileSync('profile.config.json', 'utf8'));
          const files = [
            'assets/terminal-static-enhanced.svg',
            'assets/ascii-portrait.svg',
            'assets/projects.svg'
          ];
          if (config.options?.animatedTerminal !== false) files.push('assets/terminal-enhanced.svg');
          if (config.options?.contributionHeatmap !== false) files.push('assets/contribution.svg');
          for (const file of files) {
            const raw = fs.readFileSync(file, 'utf8');
            const doc = new DOMParser().parseFromString(raw, 'application/xml');
            if (!doc.documentElement || doc.getElementsByTagName('parsererror').length) {
              throw new Error('XML parse failed: ' + file);
            }
          }
          const staticRaw = fs.readFileSync('assets/terminal-static-enhanced.svg', 'utf8');
          if (!staticRaw.includes('portraitPanel') || !staticRaw.includes('leftColumn')) {
            throw new Error('static split layout missing portraitPanel/leftColumn');
          }
          if (staticRaw.includes('scanline-overlay')) {
            throw new Error('static enhanced still has scanline-overlay');
          }
          if (config.options?.animatedTerminal !== false) {
            const animatedRaw = fs.readFileSync('assets/terminal-enhanced.svg', 'utf8');
            if (!animatedRaw.includes('unifiedTail') || !animatedRaw.includes('projectsSection')) {
              throw new Error('animated unified profile is missing generated sections');
            }
          }
          console.log('generated SVG validation ok');
          "

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if git diff --cached --quiet; then
            echo "No asset changes"
            exit 0
          fi
          git commit -m "chore: refresh profile SVG assets [skip ci]"
          git push
