<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Profile Preview</title>
<style>
  body{margin:0;background:#0d1117;color:#c9d1d9;font-family:system-ui;padding:16px}
  h1{font-size:15px;font-weight:600;margin:24px 0 8px}
  .panel{background:#161b22;border:1px solid #30363d;padding:12px;margin-bottom:8px}
  img{max-width:100%;height:auto;display:block;background:#090b0e}
  .narrow{max-width:420px}
</style></head><body>
<h1>CRT animated</h1><div class="panel"><img src="assets/terminal-enhanced.svg" width="1000" alt="crt"></div>
<h1>CRT static</h1><div class="panel"><img src="assets/terminal-static-enhanced.svg" width="1000" alt="crt-static"></div>
<h1>ASCII</h1><div class="panel narrow"><img src="assets/ascii-portrait.svg" alt="ascii"></div>
<h1>Contribution</h1><div class="panel"><img src="assets/contribution.svg" alt="contrib"></div>
<h1>Profile width ~420</h1><div class="panel narrow"><img src="assets/terminal-enhanced.svg" alt="narrow"></div>
</body></html>
