theme:
  name: "prisdvl-terminal"
  colors:
    text: "#FAF9F5"
    comment: "#87867F"
    background: "#141413"
    titleBarBackground: "#1C1B19"
    titleBarText: "#FAF9F5"
    prompt: "#D97757"
    cursor: "#D97757"
    red: "#C6613F"
    green: "#788C5D"
    yellow: "#D4A27F"
    blue: "#6A9BCC"
    magenta: "#C46686"
    cyan: "#6A9BCC"
    white: "#E3DACC"
    orange: "#C6613F"
    purple: "#C46686"
    pink: "#C46686"
    brightRed: "#D97757"
    brightGreen: "#788C5D"
    brightYellow: "#EBDBBC"
    brightBlue: "#6A9BCC"
    brightMagenta: "#C46686"
    brightCyan: "#6A9BCC"
    brightWhite: "#FAF9F5"
    brightBlack: "#5E5D59"
  buttons:
    close: "#C6613F"
    minimize: "#D4A27F"
    maximize: "#788C5D"

window:
  title: "prisdvl@terminal: ~"
  width: 1000
  autoHeight: true
  maxHeight: 1200
  style: "macos"

terminal:
  prompt: "prisdvl@dev:~$ "
  fontFamily: "ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
  fontSize: 10
  lineHeight: 1.08
  padding: 8
  paddingTop: 6

effects:
  scanlines: true
  textGlow: true
  vignette: true
  shadow: false

animation:
  defaultTypingDuration: 620
  outputLineStagger: 28
  commandOutputPause: 90
  outputEndPause: 120
  defaultSequencePause: 150

blocks:
  # BEGIN ASCII ART
  # Portrait is composed on the right by scripts/compose-split-terminal.mjs
  # (see assets/ascii-art.markup.json). Left column = typing commands only.
  # END ASCII ART

  - block: custom
    config:
      command: whoami
      lines:
        - "[[fg:orange]][[bold]]prisdvl[[/bold]][[/fg]]  Java Backend / AI Systems  [[fg:blue]]github.com/Prisdvl[[/fg]]"

  - block: custom
    config:
      command: cat ~/card.yaml
      lines:
        - "[[fg:comment]]focus[[/fg]]    [[fg:yellow]]Spring AI[[/fg]] · [[fg:yellow]]RAG[[/fg]] · [[fg:yellow]]Agent[[/fg]] · [[fg:yellow]]Distributed Systems[[/fg]]"
        - "[[fg:comment]]lang[[/fg]]     [[fg:blue]]Java[[/fg]] · [[fg:blue]]TypeScript[[/fg]] · [[fg:blue]]Rust[[/fg]] · [[fg:blue]]Python[[/fg]] · [[fg:blue]]Vue[[/fg]]"
        - "[[fg:comment]]runtime[[/fg]]  Spring Boot · Spring AI · FastAPI · Tauri · Django"
        - "[[fg:comment]]async[[/fg]]    Celery · message queues · tool-calling agents"
        - "[[fg:comment]]topics[[/fg]]   hybrid retrieval · RAG eval · production agents"
        - "[[fg:comment]]now[[/fg]]      agent platforms · retrieval eval · Tauri tooling"
        - "[[fg:comment]]status[[/fg]]   [[fg:green]]online[[/fg]] · open to collab on agents / RAG"

  - block: custom
    config:
      command: column -t ~/projects.tsv
      lines:
        - "[[fg:comment]]repo[[/fg]]                      [[fg:comment]]stack[[/fg]]       [[fg:comment]]highlight[[/fg]]"
        - "[[fg:yellow]]prisdvl-nexus[[/fg]]             Java/TS/Vue  RAG · hybrid retrieval · agents"
        - "[[fg:yellow]]homework-grading-system[[/fg]]   Python/Vue   OCR · Celery · DeepSeek scoring"
        - "[[fg:yellow]]PrisTimer[[/fg]]                 Rust/Vue/TS  Tauri 2 · anchor focus engine"
        - "[[fg:yellow]]Kakuki[[/fg]]                    JS/TS/Py     Django · React · MySQL app"

  - block: custom
    config:
      command: cat ~/skills.md
      lines:
        - "[[fg:magenta]]backend[[/fg]]  APIs · distributed services · Spring ecosystem"
        - "[[fg:magenta]]ai[[/fg]]       RAG pipelines · agent loops · retrieval eval"
        - "[[fg:magenta]]data[[/fg]]     OCR pipelines · async workers · MySQL"
        - "[[fg:magenta]]client[[/fg]]   Vue · React · Tauri desktop"

  - block: custom
    config:
      command: head ~/highlights
      lines:
        - "[[fg:orange]]▸[[/fg]] Spring AI knowledge base + tool-calling agent platform"
        - "[[fg:orange]]▸[[/fg]] K-12 grading pipeline: OCR → queue · LLM scoring"
        - "[[fg:orange]]▸[[/fg]] Rust/Tauri focus timer with liquid-glass UI"
