theme:
  name: "prisdvl-terminal"
  colors:
    text: "#C9D1D9"
    comment: "#8B949E"
    background: "#090B0E"
    titleBarBackground: "#161B22"
    titleBarText: "#C9D1D9"
    prompt: "#7EE787"
    cursor: "#7EE787"
    red: "#ff6b6b"
    green: "#7EE787"
    yellow: "#f3c969"
    blue: "#4ea1ff"
    magenta: "#d46aff"
    cyan: "#4dd0e1"
    white: "#ffffff"
    orange: "#ff9f1c"
    purple: "#8a63d2"
    pink: "#ff79c6"
    brightRed: "#ff8787"
    brightGreen: "#b2ffb2"
    brightYellow: "#fff1a8"
    brightBlue: "#9ed0ff"
    brightMagenta: "#f2c0ff"
    brightCyan: "#bff6ff"
    brightWhite: "#ffffff"
    brightBlack: "#6b7280"
  buttons:
    close: "#ff5f56"
    minimize: "#ffbd2e"
    maximize: "#27c93f"

window:
  title: "prisdvl@terminal: ~"
  width: 1000
  autoHeight: true
  maxHeight: 1200
  style: "macos"

terminal:
  prompt: "prisdvl@dev:~$ "
  fontFamily: "JetBrains Mono, Fira Code, Ubuntu Mono, monospace"
  fontSize: 11
  lineHeight: 1.25
  padding: 12
  paddingTop: 14

effects:
  scanlines: true
  textGlow: true
  vignette: true
  shadow: false

blocks:
