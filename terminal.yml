theme:
  name: "crt-terminal"
  colors:
    text: "{{themeText}}"
    comment: "{{themeMuted}}"
    background: "{{themeBackground}}"
    titleBarBackground: "{{themeSurface}}"
    titleBarText: "{{themeText}}"
    prompt: "{{themeAccent}}"
    cursor: "{{themeAccent}}"
    red: "#ef4444"
    green: "{{themeAccent}}"
    yellow: "#E3B341"
    blue: "#8AB4F8"
    magenta: "#AB68FF"
    cyan: "#4dd0e1"
    white: "{{themeText}}"
    orange: "#E3B341"
    purple: "#AB68FF"
    pink: "#AB68FF"
    brightRed: "#f87171"
    brightGreen: "#34d399"
    brightYellow: "#fbbf24"
    brightBlue: "#93c5fd"
    brightMagenta: "#c4b5fd"
    brightCyan: "#67e8f9"
    brightWhite: "#ffffff"
    brightBlack: "#6b6b6b"
  buttons:
    close: "#FF5F57"
    minimize: "#FEBC2E"
    maximize: "#28C840"

window:
  title: "{{username}}@terminal: ~"
  width: 1000
  autoHeight: true
  maxHeight: 1400
  style: "macos"

terminal:
  prompt: "{{username}}@dev:~$ "
  fontFamily: "ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
  fontSize: 10
  lineHeight: 1.08
  padding: 8
  paddingTop: 6

effects:
  scanlines: true
  textGlow: true
  vignette: true
  shadow: false

animation:
  defaultTypingDuration: 620
  outputLineStagger: 28
  commandOutputPause: 90
  outputEndPause: 120
  defaultSequencePause: 150

blocks:
  # BEGIN ASCII ART
  # Portrait is composed on the right by scripts/compose-split-terminal.mjs
  # (see assets/ascii-art.markup.json). Left column = typing commands only.
  # END ASCII ART

  - block: custom
    config:
      command: cat ~/motd
      lines:
        - "[[fg:bright_cyan]][[bold]]Welcome to {{displayName}}'s terminal[[/bold]][[/fg]]"
        - "[[fg:comment]]{{headline}}[[/fg]]"

  - block: custom
    config:
      command: whoami
      lines:
        - "[[fg:green]][[bold]]{{username}}[[/bold]][[/fg]]  ·  [[fg:blue]]github.com/{{username}}[[/fg]]"

  - block: custom
    config:
      command: date
      lines:
        - "[[fg:comment]]tz[[/fg]]      {{timezone}}"
        - "[[fg:comment]]uptime[[/fg]]  {{bio}}"

  - block: custom
    config:
      command: cat ~/stack.bars
      lines:
        {{skillsBars}}

  - block: custom
    config:
      command: cat ~/card.yaml
      lines:
        - "[[fg:comment]]── identity ──────────────────────────────[[/fg]]"
        - "{{terminalFocusLine}}"
        - "[[fg:comment]]runtime[[/fg]]  {{terminalRuntime}}"
        - "[[fg:comment]]async[[/fg]]    {{terminalAsync}}"
        - "[[fg:comment]]topics[[/fg]]   {{terminalTopics}}"
        - "[[fg:comment]]now[[/fg]]      {{terminalNow}}"
        - "[[fg:comment]]status[[/fg]]   [[fg:green]]{{terminalStatus}}[[/fg]]"

  - block: custom
    config:
      command: cat ~/skills.md
      lines:
        {{interestLines}}

  - block: custom
    config:
      command: head ~/highlights
      lines:
        {{highlightLines}}
