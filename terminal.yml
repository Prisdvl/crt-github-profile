theme:
  name: "prisdvl-terminal"
  colors:
    text: "#ececec"
    comment: "#8e8e8e"
    background: "#212121"
    titleBarBackground: "#2a2a2a"
    titleBarText: "#ececec"
    prompt: "#10A37F"
    cursor: "#10A37F"
    red: "#ef4444"
    green: "#10A37F"
    yellow: "#E3B341"
    blue: "#8AB4F8"
    magenta: "#AB68FF"
    cyan: "#4dd0e1"
    white: "#ececec"
    orange: "#E3B341"
    purple: "#AB68FF"
    pink: "#AB68FF"
    brightRed: "#f87171"
    brightGreen: "#34d399"
    brightYellow: "#fbbf24"
    brightBlue: "#93c5fd"
    brightMagenta: "#c4b5fd"
    brightCyan: "#67e8f9"
    brightWhite: "#ffffff"
    brightBlack: "#6b6b6b"
  buttons:
    close: "#FF5F57"
    minimize: "#FEBC2E"
    maximize: "#28C840"

window:
  title: "prisdvl@terminal: ~"
  width: 1000
  autoHeight: true
  maxHeight: 1400
  style: "macos"

terminal:
  prompt: "prisdvl@dev:~$ "
  fontFamily: "ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
  fontSize: 10
  lineHeight: 1.08
  padding: 8
  paddingTop: 6

effects:
  scanlines: true
  textGlow: true
  vignette: true
  shadow: false

animation:
  defaultTypingDuration: 620
  outputLineStagger: 28
  commandOutputPause: 90
  outputEndPause: 120
  defaultSequencePause: 150

blocks:
  # BEGIN ASCII ART
  # Portrait is composed on the right by scripts/compose-split-terminal.mjs
  # (see assets/ascii-art.markup.json). Left column = typing commands only.
  # END ASCII ART

  - block: custom
    config:
      command: cat ~/motd
      lines:
        - "[[fg:bright_cyan]][[bold]]Welcome to Prisd's terminal[[/bold]][[/fg]]"
        - "[[fg:comment]]Java Backend / AI Systems · agents · RAG · distributed systems[[/fg]]"

  - block: custom
    config:
      command: whoami
      lines:
        - "[[fg:green]][[bold]]prisdvl[[/bold]][[/fg]]  ·  [[fg:blue]]github.com/Prisdvl[[/fg]]"

  - block: custom
    config:
      command: date
      lines:
        - "[[fg:comment]]tz[[/fg]]      Asia/Shanghai"
        - "[[fg:comment]]uptime[[/fg]]  building agents & RAG backends"

  - block: custom
    config:
      command: cat ~/stack.bars
      lines:
        - "[[fg:blue]]Java[[/fg]]          [[fg:cyan]]████████[[/fg]][[fg:comment]]░░[[/fg]]  [[fg:comment]]80%[[/fg]]"
        - "[[fg:blue]]Spring Boot[[/fg]]   [[fg:cyan]]████████[[/fg]][[fg:comment]]░░[[/fg]]  [[fg:comment]]80%[[/fg]]"
        - "[[fg:blue]]MySQL[[/fg]]         [[fg:cyan]]███████[[/fg]][[fg:comment]]░░░[[/fg]]  [[fg:comment]]70%[[/fg]]"
        - "[[fg:blue]]Redis[[/fg]]         [[fg:cyan]]███████[[/fg]][[fg:comment]]░░░[[/fg]]  [[fg:comment]]70%[[/fg]]"
        - "[[fg:blue]]Spring Cloud[[/fg]]  [[fg:cyan]]██████[[/fg]][[fg:comment]]░░░░[[/fg]]  [[fg:comment]]60%[[/fg]]"
        - "[[fg:blue]]RabbitMQ[[/fg]]      [[fg:cyan]]██████[[/fg]][[fg:comment]]░░░░[[/fg]]  [[fg:comment]]60%[[/fg]]"
        - "[[fg:blue]]Docker[[/fg]]        [[fg:cyan]]██████[[/fg]][[fg:comment]]░░░░[[/fg]]  [[fg:comment]]60%[[/fg]]"
        - "[[fg:blue]]Spring AI[[/fg]]     [[fg:cyan]]██████[[/fg]][[fg:comment]]░░░░[[/fg]]  [[fg:comment]]60%[[/fg]]"
        - "[[fg:blue]]RAG / AI Agent[[/fg]][[fg:cyan]]██████[[/fg]][[fg:comment]]░░░░[[/fg]]  [[fg:comment]]60%[[/fg]]"
        - "[[fg:blue]]TypeScript[[/fg]]    [[fg:cyan]]█████[[/fg]][[fg:comment]]░░░░░[[/fg]]  [[fg:comment]]50%[[/fg]]"
        - "[[fg:blue]]React[[/fg]]         [[fg:cyan]]█████[[/fg]][[fg:comment]]░░░░░[[/fg]]  [[fg:comment]]50%[[/fg]]"
        - "[[fg:blue]]Python[[/fg]]        [[fg:cyan]]███[[/fg]][[fg:comment]]░░░░░░░[[/fg]]  [[fg:comment]]30%[[/fg]]"

  - block: custom
    config:
      command: cat ~/card.yaml
      lines:
        - "[[fg:comment]]── identity ──────────────────────────────[[/fg]]"
        - "[[fg:comment]]focus[[/fg]]    [[fg:yellow]]Spring AI[[/fg]] · [[fg:yellow]]RAG[[/fg]] · [[fg:yellow]]Agent[[/fg]] · [[fg:yellow]]Distributed Systems[[/fg]]"
        - "[[fg:comment]]runtime[[/fg]]  Spring Boot · Spring AI · FastAPI · Tauri · Django"
        - "[[fg:comment]]async[[/fg]]    Celery · message queues · tool-calling agents"
        - "[[fg:comment]]topics[[/fg]]   hybrid retrieval · RAG eval · production agents"
        - "[[fg:comment]]now[[/fg]]      agent platforms · retrieval eval · Tauri tooling"
        - "[[fg:comment]]status[[/fg]]   [[fg:green]]online[[/fg]] · open to collab on agents / RAG"

  - block: custom
    config:
      command: cat ~/skills.md
      lines:
        - "[[fg:magenta]]backend[[/fg]]  APIs · distributed services · Spring ecosystem"
        - "[[fg:magenta]]ai[[/fg]]       RAG pipelines · agent loops · retrieval eval"
        - "[[fg:magenta]]data[[/fg]]     OCR pipelines · async workers · MySQL"
        - "[[fg:magenta]]client[[/fg]]   Vue · React · Tauri desktop"

  - block: custom
    config:
      command: head ~/highlights
      lines:
        - "[[fg:blue]]▸[[/fg]] Spring AI knowledge base + tool-calling agent platform"
        - "[[fg:blue]]▸[[/fg]] K-12 grading pipeline: OCR → queue · LLM scoring"
        - "[[fg:blue]]▸[[/fg]] Rust/Tauri focus timer with liquid-glass UI"
