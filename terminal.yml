theme:
  name: "prisdvl-terminal"
  colors:
    text: "#C9D1D9"
    comment: "#8B949E"
    background: "#090B0E"
    titleBarBackground: "#161B22"
    titleBarText: "#C9D1D9"
    prompt: "#7EE787"
    cursor: "#7EE787"
    red: "#ff6b6b"
    green: "#7EE787"
    yellow: "#f3c969"
    blue: "#4ea1ff"
    magenta: "#d46aff"
    cyan: "#4dd0e1"
    white: "#ffffff"
    orange: "#ff9f1c"
    purple: "#8a63d2"
    pink: "#ff79c6"
    brightRed: "#ff8787"
    brightGreen: "#b2ffb2"
    brightYellow: "#fff1a8"
    brightBlue: "#9ed0ff"
    brightMagenta: "#f2c0ff"
    brightCyan: "#bff6ff"
    brightWhite: "#ffffff"
    brightBlack: "#6b7280"
  buttons:
    close: "#ff5f56"
    minimize: "#ffbd2e"
    maximize: "#27c93f"

window:
  title: "prisdvl@terminal: ~"
  width: 1000
  autoHeight: true
  maxHeight: 1200
  style: "macos"

terminal:
  prompt: "prisdvl@dev:~$ "
  fontFamily: "JetBrains Mono, Fira Code, Ubuntu Mono, monospace"
  fontSize: 11
  lineHeight: 1.12
  padding: 8
  paddingTop: 8

effects:
  scanlines: true
  textGlow: true
  vignette: true
  shadow: false

animation:
  defaultTypingDuration: 900
  outputLineStagger: 55
  commandOutputPause: 220
  outputEndPause: 280
  defaultSequencePause: 320

blocks:
  # BEGIN ASCII ART
  # Portrait is composed on the right by scripts/compose-split-terminal.mjs
  # (see assets/ascii-art.markup.json). Left column = typing commands only.
  # END ASCII ART

  - block: custom
    config:
      command: whoami
      lines:
        - "[[fg:green]]prisdvl[[/fg]]"

  - block: custom
    config:
      command: pwd
      lines:
        - "/home/prisdvl"

  - block: custom
    config:
      command: cat ~/.role
      lines:
        - "Java Backend / AI Systems"

  - block: custom
    config:
      command: cat specialties.txt
      lines:
        - "[[fg:cyan]]Spring AI[[/fg]] / [[fg:cyan]]RAG[[/fg]] / [[fg:cyan]]Agent[[/fg]]"
        - "[[fg:cyan]]Distributed Systems[[/fg]]"

  - block: custom
    config:
      command: ls ~/projects
      lines:
        - "[[fg:yellow]]prisdvl-nexus[[/fg]]/"
        - "[[fg:yellow]]homework-grading-system[[/fg]]/"
        - "[[fg:yellow]]PrisTimer[[/fg]]/"
        - "[[fg:yellow]]Kakuki[[/fg]]/"

  - block: custom
    config:
      command: echo "stack"
      lines:
        - "[[fg:comment]]lang[[/fg]]   [[fg:bright_blue]]Java[[/fg]] · [[fg:bright_blue]]TypeScript[[/fg]] · [[fg:bright_blue]]Rust[[/fg]]"
        - "[[fg:comment]]focus[[/fg]]  [[fg:magenta]]Spring AI[[/fg]] · RAG · Agent systems"

  - block: custom
    config:
      command: git remote -v
      lines:
        - "[[fg:comment]]origin[[/fg]]  [[fg:blue]]github.com/Prisdvl[[/fg]]"

  - block: custom
    config:
      command: echo "identity"
      lines:
        - "[[fg:green]][[bold]]Prisdvl[[/bold]][[/fg]] — Java Backend / AI Systems"
        - "[[fg:comment]]Specialties:[[/fg]] [[fg:cyan]]Spring AI / RAG / Agent[[/fg]] · [[fg:cyan]]Distributed Systems[[/fg]]"
        - "[[fg:magenta]]Projects:[[/fg]] [[fg:yellow]]prisdvl-nexus[[/fg]] · [[fg:yellow]]homework-grading-system[[/fg]] · [[fg:yellow]]PrisTimer[[/fg]]"
